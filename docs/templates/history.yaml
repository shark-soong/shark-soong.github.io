# 이력 항목 템플릿 — src/content/history/ko/<이름>.yaml 로 복사해 채우면 /ko/history/ 에 나타납니다 (/admin/ 에서 만드는 것이 더 쉬움).
# 파일 하나 = 활동 하나. 영어 버전은 src/content/history/en/ 에 같은 파일 이름으로 만들면 됩니다.
year: 2026            # 학년도 (3월~이듬해 2월). 3학년 겨울방학(1~2월)은 3학년 해의 연도
stage: "4학년"        # 연도 옆에 보이는 말 (예: 1학년, 군 휴학)
title: "활동 이름"
category: "교육"      # 교육봉사, 아르바이트, 교내근로, 인턴, 현장실습, 실습, 교육, 프로젝트, 공모전·대회, 학업, 장학, 해외연수, 기업탐방, 병역 등
period: "2026.07.01 – 2026.07.14"
method: ppcs          # ppcs = 성과-문제-원인-해결, star = STAR, pending = 정리 예정 (내용 숨김)
order: 999            # 같은 해 안에서의 순서 (작을수록 먼저 일어난 일)
# [머리말] 줄 다음에 "- " 항목을 적습니다. 머리말은 자유롭게 써도 됩니다 ([기타], [한계] 등).
summary: |
  [성과]
  -
  [문제]
  -
  [원인]
  -
  [해결]
  -
# 느낀점 (선택)
feelings: |

