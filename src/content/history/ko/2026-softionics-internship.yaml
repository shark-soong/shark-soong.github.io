year: 2026
stage: "4학년"
title: "소프티오닉스 하계 현장실습 (SMT 장비 셋업·PCB 제작)"
category: "현장실습"
period: "2026.07.13 – 2026.07.24 (2주)"
method: ppcs
order: 135
summary: |
  [성과]
  - 정전기 신호 기반 비접촉 감지 센서 회로를 사내 SMT 장비(CHM-T36VA)로 직접 제작하기 위한 부품 구매·장비 셋업·.dpv 변환 담당
  - BOM 약 50종 부품을 Digikey·Mouser·LCSC에서 reel 단위로 구매하는 계획서 작성: 부품별 패키지·풋프린트, 캐리어 테이프 폭·피치(피더 배정용), 최소 주문 수량, 단종·재고 없는 부품의 대체품 정리
  - 부가세 계산용 엑셀 툴을 만들어 배포 → 구매·제작 의뢰서와 Digikey 32품목 검수조서 작성에 사용
  - KiCad .pos → .dpv 변환 (SparkFun convert.py + FEEDER_DATA 피더 표) 과정 학습, 피더 29개(8 mm 22개·12 mm 4개·16 mm 2개·24 mm 1개) 기준으로 배정 준비
  - SolidWorks로 PCB(80×80×1.6 mm)·스텐실(380×280 mm) 작업대 설계·3D 프린팅 (반으로 나눠 볼트 조립, 세로 출력용 Fillet 설계, 약 17시간 출력)
  - 도착한 부품으로 납 도포 후 배치 테스트 → 부품 1종류 .dpv에서는 원하는 위치에 배치되는 것 확인
  [문제]
  - 부품 종류가 2개 이상인 .dpv에서 장비가 부품을 흡착한 뒤 비전 확인 단계로 넘어가지 않고 알람 없이 정지 (1종류일 때는 정상)
  - 스텐실의 회로 패턴이 중심에서 살짝 벗어나 제작됨
  [원인]
  - 흡착 높이·reel 설치를 의심했으나 아님 → 1종류 .dpv는 정상 → .dpv의 부품별 설정 문제로 범위 축소
  - 피더 미매칭(feeder 99) 가설은 배제: 미매칭이면 흡착이 안 되고 알람이 울려야 하는데, 실제로는 흡착 성공·알람 없음
  - (변환 코드 확인) convert.py는 Station의 Status와 EComponent의 Skip을 같은 피더 값으로 계산 → 변환 단계에서 두 값이 어긋날 가능성은 낮음
  - (변환 코드 확인) 같은 코드가 Station의 SizeX/SizeY(비전이 쓰는 부품 크기)를 항상 0으로 기록 → 비전 값은 장비의 MStack에서 부품마다 직접 보정해야 함
  - 테스트 때 첫 부품만 MStack 비전 값을 직접 보정했음 → 보정하지 않은 두 번째 부품에서 비전 단계로 못 넘어가고 정지한 것으로 원인 판단 (실습 종료로 재실행 검증은 못 함)
  - 스텐실 중심 정렬은 주문할 때 따로 요청해야 함
  [해결]
  - 원인 범위를 .dpv로 좁히고 프로그램 개발부에 정상/비정상 .dpv 비교 분석 요청 (실습 종료 시점)
  - 해결 방법 정리: 모든 부품의 MStack 비전 값 보정, 또는 피더 표에 부품 크기를 넣고 변환기가 SizeX/SizeY를 채우도록 수정
  - 그래도 멈출 때의 확인 순서: Step 모드로 정지 지점 특정 → 비전 플래그를 끄고 재현 테스트 → Station Status와 EComponent Skip 값 비교
  - 다음 스텐실은 중심 정렬로 주문하기로 결정
  [참고 자료 (GitHub)]
  - sparkfunX/Desktop-PickAndPlace-CHMT36VA: KiCad-Conversion/convert.py (Station SizeX/SizeY를 0으로 기록, Status·Skip을 같은 비트 규칙으로 계산)
  - sparkfunX/Desktop-PickAndPlace-CHMT36VA Issue #10: Station과 EComponent 내용이 어긋나면 일부 부품만 배치되는 사례 (Eagle 변환)
  - tdarlic/CHMT48VB-Kicad-Conversion 커밋 d4af496: 피더 표에서 부품 크기를 읽어 1/100 mm 단위로 기록하도록 수정한 포크
  - HdsSystems DPV 파일 사양: EComponent Skip은 Station Status와 같아야 하고, Station에는 노즐 필드가 없어 노즐을 먼저 정한 뒤 비전 값을 잡아야 함
  [기타]
  - 회사 과제: 공간 컴퓨팅용 표면 전하 기반 비접촉 제스처 입력 센싱 솔루션
  - 테스트 회로는 직경 3·6·12·15 mm 원형 센서를 각각 구현 (직경이 클수록 감지 거리가 늘어나는 것으로 보임)
  - 목표 사양: 로봇 손용 근접 센서, 반응속도 약 10 ms·감지 거리 약 20 cm, SoC 전에 PCB로 1차 검증
