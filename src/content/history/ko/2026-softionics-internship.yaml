year: 2026
stage: "4학년"
title: "소프티오닉스 현장실습 (SMT 장비 셋업)"
category: "현장실습"
period: "4학년 여름방학 (9일)"
method: ppcs
order: 150
summary: |
  [성과]
  - 비접촉 센서 원리 논문 공부, PCB 장비 셋업용 부품(Digikey·Mouser·LCSC, reel) 구매계획서 작성
  - 부품 패키지 조사·부가세 계산용 엑셀 툴 제작 및 사내 배포
  - KiCad .pos → .dpv 변환 과정 학습 (오픈소스 변환 스크립트)
  - SolidWorks로 PCB(80×80×1.6 mm)·스텐실(380×280 mm) 작업대 3D 모델링 → 출력 성공 (크기 때문에 반으로 나눠 볼트 조립, 세로 출력용 Fillet 설계, 약 17시간 출력)
  - reel을 SMT 장비(CHM-T36VA)에 세팅, 납 도포 후 부품 배치 테스트
  [문제]
  - 부품 종류가 2개 이상인 .dpv에서 장비가 부품을 집은 뒤 비전 체크로 넘어가지 않고 알람 없이 정지
  - 스텐실의 회로 패턴이 중심에서 살짝 벗어나 제작됨
  [원인]
  - 높이·reel 설치 문제를 의심했으나 아님 → 부품 1종류 .dpv 테스트는 정상 → .dpv 파일 문제로 범위 축소
  - 가설: Station(피더) ↔ EComponent(배치) 테이블의 비전 플래그 불일치, 두 번째 부품의 비전 파라미터 미보정, 장비 펌웨어 결함 가능성
  - 스텐실 중심 정렬은 주문 시 따로 요청해야 함
  [해결]
  - 원인 범위를 .dpv 파일로 좁히고 프로그램 개발부에 정상/비정상 .dpv 비교 분석 요청
  - 확인 순서 정리: .dpv 필드 비교 → 비전 파라미터 확인 → Step 모드로 정지 지점 특정 → 비전 플래그 끄고 재현 테스트
  - 다음 스텐실은 중심 정렬로 주문하기로 결정
  [기타]
  - 회사 목표: 로봇 손용 근접 센서 (반응속도 약 10 ms, 감지 거리 약 20 cm), SoC 전에 PCB로 1차 테스트
