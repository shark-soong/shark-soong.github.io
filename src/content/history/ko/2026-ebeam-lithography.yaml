year: 2026
stage: "4학년"
title: "E-beam Lithography 사용 교육 (한국나노기술원)"
category: "실습"
period: "4학년 2학기 (3일 과정)"
method: ppcs
order: 180
summary: |
  [성과]
  - 양자·AI·반도체 융합산업 전문인력양성 교육, JEOL JBX-8100FS(100 kV)로 레지스트 코팅 → Job 작성·노광 → 현상 → Align → Strip 전 과정 진행
  - maN-2400(negative), Dose 700 µC/cm² 조건에서 60 nm 패턴까지 형성 확인
  [문제]
  - ① 스포이드 적하 코팅에서 물방울 모양 도포 불량 약 5곳 (각각 웨이퍼 면적의 약 1/100)
  - ② L자 패턴 안쪽 모서리가 설계보다 크게 형성
  [원인]
  - ① 웨이퍼 표면 파티클에 ER 액적이 부딪힘 (추정), 표준 코팅 순서 대신 스포이드 방식 사용
  - ② 근접효과: 인접 영역에서 후방산란된 전자가 레지스트를 추가로 노광
  [해결]
  - ① 표준 코팅 순서 정리 (adhesion → 냉각 → 센터 정렬 → 스핀 → soft bake)
  - ② Beamer(GenISys)로 PEC 적용: 고립 패턴은 Dose↑, 조밀 패턴은 중앙↓·가장자리↑
