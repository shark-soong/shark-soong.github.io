year: 2021
stage: "1학년"
title: "SWEAT 서연고팀 팀장"
category: "교육봉사"
period: "2021.03.02 – 2021.12.31"
method: ppcs
order: 10
summary: |
  [성과]
  - 반 수업 참여 학생 6명 → 18명 (20명 중, 포인트 1점 이상 기준)
  - 같은 방식을 공유한 다른 튜터 반도 6~7명 → 15명 이상으로 증가
  [문제]
  - 튜터 4명이 20명씩 맡은 비대면 수업에서 대답 참여율 30% 미만
  [원인]
  - 비대면 + 비디오 필수 아님 → 대답이 없으면 수업을 듣는지 알 수 없음
  - 이론 설명 후 문제 풀이(4문제, 문제당 5분) 위주라 학생이 참여할 계기가 적음
  [해결]
  - 포인트제 도입: 질문·답변 1점, 문제 정답 2점
  - 포인트 수만큼 이름 쪽지를 넣고 룰렛 추첨 → 아이스크림 선물
feelings: |
  학생들의 관심 및 동기(motivation)를 확보하는게 수업의 내용 이전에 focus할 문제라고 생각된다.
