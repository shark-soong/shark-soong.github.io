year: 2026
stage: "4학년"
title: "AI 반도체 포토공정 불량 분석 딥러닝 모델 학습"
category: "프로젝트"
period: "4학년 여름방학 (발표 정리 2026.08.21)"
method: star
order: 170
summary: |
  [S]
  - 포토공정 불량 이미지 9클래스 분류 모델 학습 (두 도메인 a=1/a=2, 이미지 크기 588×589 ~ 1600×1200로 불균일)
  [T]
  - 적은 데이터와 클래스 불균형(정상 132장 vs 최소 클래스 20장) 속에서 분류 성능 확보, 발표 준비
  [A]
  - 도메인별 분리 학습 → 클래스당 표본 부족(최소 8장) → 두 도메인 통합 9클래스 학습
  - 미세 결함 정보 보존을 위해 224×224 대신 448×448로 리사이즈
  - 화이트 노이즈 증강으로 결함과 무관한 잡음에 대한 견고성 확보
  - 자체 CNN(scratch) → ImageNet 사전학습 ResNet18 전이학습, layer4 + fc만 미세조정
  - 층화 8:1:1 분할 + WeightedRandomSampler로 불균형 보정, 5-fold CV로 분할 우연성 검증
  [R]
  - ResNet18이 EfficientNet-B0보다 같은 100 epoch 안에서 더 안정적으로 수렴 (학습 파라미터 약 7.4배)
  - EfficientNet-B0도 epoch 100 → 300에서 val_loss 0.78 → 0.24로 개선 → 구조 열세가 아닌 학습 예산 차이로 해석
