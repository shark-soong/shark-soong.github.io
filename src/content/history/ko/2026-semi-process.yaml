year: 2026
stage: "4학년"
title: "SEMI 반도체공정실습교육 (2026-8회차, 명지대 팹)"
category: "실습"
period: "2026.10.26 – 2026.10.29"
method: ppcs
order: 190
summary: |
  [성과]
  - B1조 데이터 분석·발표 담당: 300 mm PECVD SiO₂ 증착 압력 2.5 → 3.25 Torr로 두께 균일도 3.57% → 2.76% (22.8% 개선), 두께 범위 204 → 101 Å
  - DC Bias 해석(1 Torr에서 플라즈마가 gap 밖으로 퍼짐)을 SPDRC 연구원들이 흥미롭게 봄
  - Lam Kiyo45 식각, RPS 챔버 클리닝 실습, 챔버 오픈 관찰
  [문제]
  - 1차 증착(2.5 Torr, gap 15 mm)에서 중앙이 두꺼운 돔형 분포 (중앙 +6.6%, 최외곽 −2.5%)
  [원인]
  - 압력에 따라 분포가 반전 (2.5 Torr 중앙 두꺼움, 4 Torr 가장자리 두꺼움) → O 라디칼 분포가 두께 분포를 정한다는 가설 (문헌 근거)
  [해결]
  - 변수 1개만 바꿀 수 있는 2차 증착에서 두 조건 사이 내삽값 3.25 Torr 선택
  - 해석 전 데이터 검증: Unif 정의(1σ/평균) 확인, DC Bias 16비트 부호 보정, 템플릿 셀 오류 수정
  [한계]
  - 증착률 27.1 → 16.0 Å/s (−41%), 조건당 웨이퍼 1장
