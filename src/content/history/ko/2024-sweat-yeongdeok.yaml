feelings: |
  그냥 재미있었다. 확실히 어린이들이 활기차게 뛰어 노는 모습과 꺄르륵 거리는 웃음 소리를 들으니 기분이 좋았다.
  어린이들이 마음껏 활기차게 웃는 세상 그런 세상을 유지하는 것이 나의 가치관이다.
