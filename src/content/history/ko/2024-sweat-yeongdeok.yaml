  [S]
  - 영덕초 5학년 대상 언플러그드 알고리즘 수업 (보드게임 3개, 총 3회)
  [T]
  - 팀원으로 참여, 4명이 수업을 한 번씩 나눠 진행하기로 함
  [A]
  - 팀원 한 명이 아파서 그 수업을 대신 맡음 → 총 2회 진행
