year: 2026
stage: "4학년"
title: "융합캡스톤디자인1 (4-1학기) · Starship Belly Flop 착륙 강화학습"
category: "프로젝트"
period: "2026.03 – 2026.06.22 (최종 발표 06.22) · 4인 팀 (구현·아이디어 제시)"
method: ppcs
order: 127
summary: |
  [개요]
  - SpaceX Starship의 Belly Flop 착륙(배면 활공 → 플립 → 수직 착륙)을 Unity ML-Agents PPO로 구현
  - 4인 팀, 전 과정 함께 진행 (조별 순위 없음)
  - 내 역할: 구현 및 아이디어 제시 — 학기 초 주제(반도체 공정 스케줄링, Double DQN + PER)와 최종 주제(Belly Flop) 모두 내 아이디어
  - "움직이는 동적 요소의 제어"를 학습시키고 싶어 스케줄링에서 Belly Flop으로 전환
  [성과]
  - PID·경로 계획 없이 보상 함수 설계만으로 Belly Flop 학습 → 약 12M 스텝, 최종 스테이지(0–500 m) 착륙 성공률 85%
  - Unity 기본 물리를 끄고 6-DOF 물리 직접 구현 (무게중심 이동·관성 재계산·받음각별 항력·플랩 공력·TVC), 배면 낙하 종단속도 약 77 m/s (실측 약 66 m/s)
  - 누적 보상 약 15 → 57, 착지 패드 오차 약 13 → 5 m, 기울기 약 5° → 1.7°, 충돌 속도 약 2 m/s
  [문제]
  - 3D 제어(5브랜치, 162가지 행동)에서 착륙은 되지만 Belly Flop이 안 됨
  - 연속 행동을 11단계로 나누면 학습이 안 됨, 12단계 커리큘럼은 너무 어려움
  - 학습 중 오버슈트·호버링 발생
  [원인]
  - 행동 공간이 너무 커서 탐색이 어려움, 짐벌 Yaw가 롤·회전 불안정을 유발
  - 고고도 전체 기동을 처음부터 학습하면 탐색 실패
  - 감속 보상 가중치가 약함
  [해결]
  - 짐벌 Yaw·플랩 Roll 제거 → 피치 평면 3브랜치 {3,3,3} (27가지), 행동 3단계
  - 커리큘럼 5단계로 축소 (저고도 수직 → 배면 자세)
  - 포텐셜 기반 보상 셰이핑 + S자 틸트 스케줄 + 위상 경계 보상 + Soft-Gate 착지 보상, w_speed 1.0 → 4.5로 조정
  - 페널티(채터링·상승·기울기·스핀·이탈·타임아웃)로 원치 않는 행동 억제
  [한계]
  - 이산 행동이라 TVC·플랩이 매 스텝 ±15°를 오가는 채터링, 보상 해킹 위험, 바람·센서 노이즈·연료 슬로싱 미반영
  - 학습은 0–500 m, 피치 평면(2D)에 한정
  - 보고서의 후속 계획: 연속 행동 공간, 롤·요 확장, 발사부터 착륙까지 전 과정 (실제 캡스톤2는 다른 주제로 진행 중)
  [기타]
  - 상세: 홈페이지 프로젝트 「Starship Belly Flop 착륙 강화학습」, Claude 문서 「캡스톤 프로젝트 1학기 정리」
  - 사용: Unity, C#, ML-Agents, PPO, YAML, TensorBoard
