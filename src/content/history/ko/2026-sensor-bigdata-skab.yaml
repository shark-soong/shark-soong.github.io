year: 2026
stage: "4학년"
title: "센서빅데이터처리 파이널 프로젝트 · SKAB 산업 설비 이상 탐지"
category: "프로젝트"
period: "2026.05.28 – 2026.06.17 (약 3주, 4-1학기 수업) · 후속 v2 2026.11.20"
method: ppcs
order: 125
summary: |
  [성과]
  - (HW4, 수업 제출) SKAB 밸브 이상 데이터 20개 파일을 시각화·PCA·미분 분석 → RateRMS(유량)·Accelerometer2RMS를 핵심 센서로 고르고, 가중치(4/7, 3/7)와 임계값으로 Hyper Feature를 정의해 변화점 탐지
  - (v2, 수업 후 개인 후속) 같은 단계를 학습 모델 4종(Logistic Regression, LightGBM, 1D-CNN, LSTM-Autoencoder)으로 바꾸고, 누수를 막은 평가 체계를 새로 설계
  - LightGBM: 처음 보는 20개 파일을 모두 과거 60초만 보고 탐지 — 지연 중앙값 30.5초, 오경보 9회, F1 0.867
  - LSTM-AE(정상 데이터만 학습): 오경보 2회 → 이상 라벨이 없는 현장의 대안으로 확인
  - "이상을 미리 예측할 수 있는가"는 대조 실험으로 불가능함을 입증 (센서 모델 AUC 0.41–0.58 vs 경과 시간만 쓴 대조 모델 0.99–1.00)
  [문제]
  - HW4 결과를 오경보까지 포함해 다시 평가하니 5개 테스트 파일 중 1개만 성공에 가까움 (3개는 변화점보다 200–516초 앞서 오경보)
  - HW4 규칙은 실시간 판단이 불가능하고, 성공률(3/5)이 실제보다 높게 계산됨
  [원인]
  - 시각 t를 판단할 때 t 이후 50초 데이터를 사용 → 구조적으로 최소 50초 지연
  - 테스트 파일을 자기 자신의 평균·표준편차로 정규화 → 운용 중엔 알 수 없는 미래 정보 누수
  - 변화점 부근만 평가 → 그 이전의 오경보가 집계되지 않음
  - 가중치·임계값을 수작업으로 정하고 누적 평균을 써서 시간이 지날수록 변화가 묻힘
  - 데이터 특성: 20개 중 18개 파일에서 이상이 정확히 600초에 시작 → 모델이 전조가 아니라 "경과 시간"을 학습할 위험
  - PCA는 분산이 큰 방향을 찾을 뿐 이상을 가르는 방향을 찾지 않음 → Accelerometer2RMS에 준 가중치(3/7)는 근거 없음 (permutation importance ≈ 0)
  [해결]
  - 과거 60초만 쓰는 causal 슬라이딩 윈도우로 실시간 판단 가능하게 변경
  - 정규화 기준선은 각 파일 앞 300초 중앙값, 스케일은 학습 fold 통계 → 테스트 파일 정보 미사용
  - 파일 단위 5-fold 교차검증 + 별도 검증 파일로 임계값 선택 (비용 = 평균 탐지 지연 + 120 × 오경보), 3초 연속 초과 시 알람
  - 5초 이상 결측은 big_gap으로 표시해 보간된 가짜 구간의 알람은 오경보에서 제외
  - 사전 예측 실험은 window demeaning으로 절대 수준을 지우고, 경과 시간만 쓰는 대조 모델로 시간 누수 크기를 직접 측정
  - 이상 시작 시점 기준 정렬 분석 → 탐지 지연(약 30초)이 밸브 폐쇄 후 유량이 실제로 줄어드는 시간(중앙값 39초)과 일치 → 모델이 물리 신호에 반응함을 확인
  [한계]
  - 파일 20개, 파일당 이상 1회뿐이라 신뢰구간이 넓음
  - 운전 조건이 다른 데이터(anomaly-free, 유량 약 4배)로의 일반화는 미검증
  - 오경보 1회 = 120초 지연이라는 비용은 설계 가정
  [기타]
  - 사용: Python, PyTorch, scikit-learn, LightGBM, pandas
  - 참고 논문: BiLSTM-VAE dynamic loss (Results in Engineering, 2025), Anomaly Detection Augmented with Regression (CODS-COMAD 2024)
