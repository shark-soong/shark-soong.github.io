# Sveltia CMS 설정 — https://shark-soong.github.io/admin/
# 로그인: "Sign In Using Access Token" → GitHub fine-grained 토큰 (이 저장소만, Contents: Read and write)
# 저장하면 main 브랜치에 커밋되고, GitHub Actions가 1~2분 안에 사이트를 다시 배포합니다.
# 메뉴 순서: 글 → 프로젝트 → 이력 → Now

backend:
  name: github
  repo: shark-soong/shark-soong.github.io
  branch: main
  commit_messages:
    create: "{{collection}} 추가: {{slug}}"
    update: "{{collection}} 수정: {{slug}}"
    delete: "{{collection}} 삭제: {{slug}}"
    uploadMedia: "이미지 업로드: {{path}}"
    deleteMedia: "이미지 삭제: {{path}}"

site_url: https://shark-soong.github.io
display_url: https://shark-soong.github.io

# 본문에 넣는 이미지는 public/images/uploads/ 에 저장되고 /images/uploads/파일명 으로 연결됩니다.
media_folder: public/images/uploads
public_folder: /images/uploads

# 한국어가 기본, 영어는 선택. 파일 위치: src/content/<컬렉션>/<언어>/<이름>.<확장자>
i18n:
  structure: multiple_folders
  locales: [ko, en]
  default_locale: ko
  save_all_locales: false # 영어 번역 없이 한국어만 저장 가능 (영어 페이지에는 한국어 원문이 보임)

collections:
  # ─────────────────────────────── 글
  - name: writing
    label: 글
    label_singular: 글
    folder: src/content/writing
    extension: md
    format: frontmatter
    create: true
    delete: true
    i18n: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # 파일 이름(=주소): 2026-11-16-제목
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string, i18n: true }
      - { label: 설명 (목록·공유 미리보기에 보이는 한두 문장), name: description, widget: text, i18n: true }
      - { label: 발행일, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, default: "{{now}}", i18n: duplicate }
      - { label: 수정일, name: updated, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, i18n: duplicate }
      - { label: 태그, name: tags, widget: list, required: false, i18n: duplicate }
      - { label: 초안 (켜두면 사이트에 안 보임), name: draft, widget: boolean, default: false, i18n: duplicate }
      - { label: 본문, name: body, widget: markdown, i18n: true }

  # ─────────────────────────────── 프로젝트
  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    folder: src/content/projects
    extension: md
    format: frontmatter
    create: true
    delete: true
    i18n: true
    slug: "{{slug}}" # 파일 이름(=주소). 영어 제목으로 만들면 주소가 깔끔해요
    summary: "{{title}} — {{summary}}"
    sortable_fields: [date, title, order]
    fields:
      - { label: 제목, name: title, widget: string, i18n: true }
      - { label: 한 줄 설명 (목록에 보임), name: summary, widget: string, i18n: true }
      - { label: 날짜 (정렬 기준), name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, i18n: duplicate }
      - { label: 기간 (화면 표시용, 예 2025.03 – 2025.06), name: period, widget: string, required: false, i18n: true }
      - { label: 역할 (예 개인 프로젝트, 팀장 4인), name: role, widget: string, required: false, i18n: true }
      - { label: 태그, name: tags, widget: list, required: false, i18n: duplicate }
      - { label: 홈 화면에 노출, name: featured, widget: boolean, default: false, i18n: duplicate }
      - { label: 우선순위 (클수록 위), name: order, widget: number, value_type: int, default: 0, required: false, i18n: duplicate }
      - { label: 저장소 링크, name: repo, widget: string, required: false, i18n: duplicate }
      - { label: 데모 링크, name: demo, widget: string, required: false, i18n: duplicate }
      - { label: 초안 (켜두면 사이트에 안 보임), name: draft, widget: boolean, default: false, i18n: duplicate }
      - { label: 본문, name: body, widget: markdown, i18n: true }

  # ─────────────────────────────── 이력 (/ko/history/)
  - name: history
    label: 이력
    label_singular: 이력 항목
    folder: src/content/history
    extension: yaml
    format: yaml
    create: true
    delete: true
    i18n: true
    slug: "{{slug}}"
    summary: "{{year}} · {{title}}"
    sortable_fields: [year, order, title]
    view_groups:
      - { label: 연도, field: year }
    fields:
      - { label: 학년도 (3월~이듬해 2월 기준), name: year, widget: number, value_type: int, i18n: duplicate }
      - { label: 연도 옆 설명 (예 4학년, 군 휴학), name: stage, widget: string, required: false, i18n: true }
      - { label: 활동 이름, name: title, widget: string, i18n: true }
      - label: 구분
        name: category
        widget: select
        i18n: duplicate
        options: [교육봉사, 아르바이트, 교내근로, 인턴, 현장실습, 실습, 교육, 프로젝트, 공모전·대회, 학업, 장학, 해외연수, 기업탐방, 병역, 기타]
      - { label: 기간 (예 2026.07.01 – 2026.07.14), name: period, widget: string, i18n: true }
      - label: 정리 방식
        name: method
        widget: select
        default: ppcs
        i18n: duplicate
        options:
          - { label: 성과-문제-원인-해결, value: ppcs }
          - { label: STAR, value: star }
          - { label: 정리 예정 (제목·기간만 보임), value: pending }
      - { label: 같은 해 안의 순서 (작을수록 먼저 일어난 일), name: order, widget: number, value_type: int, default: 999, i18n: duplicate }
      - label: 정리 (개조식)
        name: summary
        widget: text
        required: false
        i18n: true
        hint: "[성과] / [문제] / [원인] / [해결] 또는 [S] / [T] / [A] / [R] 머리말 줄 다음에 '- 항목'을 적습니다. [기타], [한계]처럼 자유로운 머리말도 됩니다."
        default: "[성과]\n- \n[문제]\n- \n[원인]\n- \n[해결]\n- "
      - { label: 느낀점, name: feelings, widget: text, required: false, i18n: true }

  # ─────────────────────────────── 단독 페이지
  - name: pages
    label: 페이지
    i18n: true
    files:
      - name: now
        label: Now (요즘 하는 일)
        file: src/content/pages/{{locale}}/now.md
        i18n: true
        fields:
          - { label: 제목, name: title, widget: string, i18n: true }
          - { label: 설명, name: description, widget: string, required: false, i18n: true }
          - { label: 마지막 업데이트, name: updated, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, i18n: duplicate }
          - { label: 상단 메뉴에 표시, name: nav, widget: boolean, default: true, i18n: duplicate }
          - { label: 메뉴 순서, name: navOrder, widget: number, value_type: int, default: 30, i18n: duplicate }
          - { label: 본문, name: body, widget: markdown, i18n: true }
