# Sveltia CMS 설정 — https://shark-soong.github.io/admin/
# 로그인: "Sign in with Token" → GitHub fine-grained 토큰 (이 저장소만, Contents: Read and write)
# 저장하면 main 브랜치에 커밋되고, GitHub Actions가 1~2분 안에 사이트를 다시 배포합니다.

backend:
  name: github
  repo: shark-soong/shark-soong.github.io
  branch: main
  commit_messages:
    create: "글 추가: {{slug}}"
    update: "글 수정: {{slug}}"
    delete: "글 삭제: {{slug}}"
    uploadMedia: "이미지 업로드: {{path}}"
    deleteMedia: "이미지 삭제: {{path}}"

site_url: https://shark-soong.github.io
display_url: https://shark-soong.github.io

# 본문에 넣는 이미지는 public/images/uploads/ 에 저장되고 /images/uploads/파일명 으로 연결됩니다.
media_folder: public/images/uploads
public_folder: /images/uploads

# 한국어가 기본, 영어는 선택. 파일 위치: src/content/writing/<언어>/<주소>.md
i18n:
  structure: multiple_folders
  locales: [ko, en]
  default_locale: ko
  save_all_locales: false # 영어 번역 없이 한국어만 저장 가능 (영어 페이지에는 한국어 원문이 보임)

collections:
  - name: writing
    label: 글
    label_singular: 글
    folder: src/content/writing
    extension: md
    format: frontmatter
    create: true
    delete: true
    i18n: true
    # 파일 이름(=주소): 2026-11-16-제목
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - label: 제목
        name: title
        widget: string
        i18n: true
      - label: 설명 (목록·공유 미리보기에 보이는 한두 문장)
        name: description
        widget: text
        i18n: true
      - label: 발행일
        name: date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
        i18n: duplicate
      - label: 수정일
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
        i18n: duplicate
      - label: 태그
        name: tags
        widget: list
        required: false
        i18n: duplicate
      - label: 초안 (켜두면 사이트에 안 보임)
        name: draft
        widget: boolean
        default: false
        i18n: duplicate
      - label: 본문
        name: body
        widget: markdown
        i18n: true
